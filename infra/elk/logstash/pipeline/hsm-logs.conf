# Ships the backend's structured JSON log file into Elasticsearch.
input {
  file {
    path => "/var/log/hsm/hsm-backend.json"
    codec => json
    sincedb_path => "/usr/share/logstash/data/hsm-logs.sincedb"
    start_position => "beginning"
    mode => "tail"
  }
}

filter {
  if ![app] {
    mutate { add_field => { "app" => "hsm-backend" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hsm-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
