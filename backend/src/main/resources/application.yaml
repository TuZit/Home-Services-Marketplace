spring:
  application:
    name: home_services_marketplace
  datasource:
    url: jdbc:postgresql://localhost:5432/hsm
    username: hsm
    password: hsm
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

app:
  jwt:
    secret: "change-me-to-a-long-random-secret-that-is-at-least-32-bytes-long"
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  security:
    jwt:
      secret: change-me-please-this-is-a-dev-only-secret-key-0123456789abcdef
      access-ttl-seconds: 900
      refresh-ttl-seconds: 2592000
    refresh-cookie:
      name: refresh_token
      secure: true
      same-site: Lax
      path: /api/v1/auth
    allowed-origins: http://localhost:5173,http://localhost:8080
  time:
    zone: Asia/Ho_Chi_Minh
